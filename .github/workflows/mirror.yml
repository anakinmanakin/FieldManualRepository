name: Mirror Field Manual Vault

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
    inputs:
      budget_gb:
        description: "Stop when files/ reaches this many GB"
        default: "4"

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download manuals (commits and pushes in batches)
        env:
          BUDGET_GB: ${{ inputs.budget_gb || '4' }}
          MAX_MINUTES: "320"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          python3 scripts/fetch_vault.py
